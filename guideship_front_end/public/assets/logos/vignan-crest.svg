<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradCrest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wheelBlueCrest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M 12 12 Q 55 24 98 12 Q 94 65 55 102 Q 16 65 12 12 Z" 
        fill="#ffffff" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Purple circular sector fill -->
  <circle cx="55" cy="52" r="32" fill="url(#shieldGradCrest)" />

  <!-- Blue 5-Spoke Wheel -->
  <circle cx="55" cy="52" r="14" fill="#0369a1" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 5-Point Center Star -->
  <path d="M 55 43 L 57.5 49 L 63.5 49.5 L 59 53.5 L 60.5 59.5 L 55 56 L 49.5 59.5 L 51 53.5 L 46.5 49.5 L 52.5 49 Z" 
        fill="#ffffff"/>

  <!-- Spokes -->
  <path d="M 52 38 L 52 20 L 58 20 L 58 38 Z" fill="url(#wheelBlueCrest)" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 66 43 L 83 31 L 87 36 L 69 48 Z" fill="url(#wheelBlueCrest)" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 64 62 L 75 80 L 70 83 L 59 65 Z" fill="url(#wheelBlueCrest)" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 46 62 L 35 80 L 40 83 L 51 65 Z" fill="url(#wheelBlueCrest)" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 44 43 L 27 31 L 23 36 L 41 48 Z" fill="url(#wheelBlueCrest)" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Wheel Outer Ring -->
  <circle cx="55" cy="52" r="32" fill="none" stroke="#0284c7" stroke-width="3"/>
</svg>
